<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head}"></head>

<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container mt-5">
        <h2 class="text-center mb-4">Gestión de Producto</h2>
        <div class="row justify-content-center">
            <div class="col-md-6">
                <form action="#" th:action="@{/save-product}" th:object="${product}" method="post"
                    enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label">Nombre del Producto</label>
                        <input type="text" th:field="*{nameProduct}" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Descripción</label>
                        <textarea th:field="*{description}" class="form-control" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Precio</label>
                        <input type="number" step="0.01" th:field="*{price}" class="form-control" required>
                    </div>
                    <!-- Upload imagen (simplificado) -->

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: footer}"></div>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>

</html>
