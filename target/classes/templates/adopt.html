<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head}"></head>

<body>

    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <!-- Inicio Adopción -->
    <div class="container-fluid py-5">
        <div class="container">
            <div class="border-start border-5 border-primary ps-5 mb-5" style="max-width: 800px;">
                <h6 class="text-primary text-uppercase">Adopta un amigo</h6>
                <h1 class="display-5 text-uppercase mb-0">Buscan un hogar</h1>
            </div>

            <div class="row">
                <div class="col-lg-4 col-md-6 mb-4" th:each="pet : ${pets}">
                    <div
                        class="product-item position-relative bg-light d-flex flex-column text-center h-100 shadow-sm rounded overflow-hidden">
                        <div class="position-relative overflow-hidden">
                            <img class="img-fluid w-100" th:src="@{'/uploads/' + ${pet.image}}" alt="mascota"
                                style="height: 250px; object-fit: cover;">
                            <div class="position-absolute top-0 start-0 m-2">
                                <span class="badge bg-primary" th:if="${pet.breed != null}"
                                    th:text="${pet.breed}">Raza</span>
                            </div>
                        </div>

                        <div class="p-4 flex-grow-1 d-flex flex-column">
                            <h5 class="text-uppercase mb-1" th:text="${pet.namePet}">Nombre Mascota</h5>
                            <div class="mb-3 text-muted small">
                                <span th:text="${pet.gender} == 'M' ? 'Macho' : 'Hembra'">Género</span> •
                                <span th:text="${pet.age} + ' Años'">Edad</span>
                                <span th:if="${pet.location != null}" th:text="'• ' + ${pet.location}"></span>
                            </div>
                            <p class="px-2 mb-4" th:text="${#strings.abbreviate(pet.description, 80)}">Descripción...
                            </p>

                            <div class="mt-auto">
                                <a class="btn btn-primary py-2 px-4 rounded-pill w-100"
                                    th:href="@{'/pet-detail'(id=${pet.id})}">
                                    Ver Detalles
                                </a>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-12 text-center" th:if="${#lists.isEmpty(pets)}">
                    <p>No hay mascotas disponibles para adopción en este momento.</p>
                </div>
            </div>
        </div>
    </div>
    <!-- Fin Adopción -->

    <div th:replace="~{fragments/layout :: footer}"></div>
    <div th:replace="~{fragments/layout :: scripts}"></div>

</body>

</html>
