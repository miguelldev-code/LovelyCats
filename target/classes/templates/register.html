<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head}"></head>

<body>

    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container-fluid p-5">
        <div class="container">
            <div class="border-start border-5 border-primary ps-5 mb-5" style="max-width: 600px;">
                <h6 class="text-primary text-uppercase">Únete a nosotros</h6>
                <h1 class="display-5 text-uppercase mb-0">Registrarse</h1>
            </div>
            <div class="row g-5">
                <div class="col-lg-6 mx-auto">
                    <form th:action="@{/register}" th:object="${user}" method="post">

                        <div th:if="${param.error != null}" class="alert alert-danger">
                            <span th:if="${param.error[0] == 'duplicate'}">El correo electrónico ya está
                                registrado.</span>
                            <span th:if="${param.error[0] == 'generic'}">Error en el registro. Intenta
                                nuevamente.</span>
                            <span th:if="${param.error[0] == ''}">Error en el registro.</span>
                        </div>

                        <div class="mb-3">
                            <label>Nombre</label>
                            <input type="text" th:field="*{firstName}" class="form-control bg-light border-0 px-4"
                                style="height: 55px;" required>
                        </div>
                        <div class="mb-3">
                            <label>Apellido</label>
                            <input type="text" th:field="*{lastName}" class="form-control bg-light border-0 px-4"
                                style="height: 55px;" required>
                        </div>
                        <div class="mb-3">
                            <label>Email (Usuario)</label>
                            <input type="text" th:field="*{email}" class="form-control bg-light border-0 px-4"
                                style="height: 55px;" required>
                        </div>
                        <div class="mb-3">
                            <label>Contraseña</label>
                            <input type="password" th:field="*{password}" class="form-control bg-light border-0 px-4"
                                style="height: 55px;" required>
                        </div>

                        <div class="mb-3">
                            <button class="btn btn-primary w-100 py-3" type="submit">Registrarse</button>
                        </div>
                        <div class="text-center">
                            <p>¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a></p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: footer}"></div>
    <div th:replace="~{fragments/layout :: scripts}"></div>

</body>

</html>
