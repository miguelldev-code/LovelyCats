<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head}"></head>

<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container-fluid">
        <div class="row">
            <!-- Reuse Sidebar -->
            <div class="col-md-3 col-lg-2 d-md-block bg-light sidebar collapse shadow-sm" style="min-height: 100vh;">
                <div class="position-sticky pt-3">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link text-dark" href="/admin/dashboard"><i
                                    class="bi bi-speedometer2 me-2"></i>Dashboard</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-dark" href="/admin/products"><i
                                    class="bi bi-cart me-2"></i>Productos</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-dark" href="/admin/pets"><i
                                    class="bi bi-heart me-2"></i>Mascotas</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active fw-bold text-primary" href="/admin/users"><i
                                    class="bi bi-people me-2"></i>Usuarios</a>
                        </li>
                    </ul>
                </div>
            </div>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white border-bottom-0 pb-0">
                        <h4 class="mb-0">Gestión de Usuario</h4>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/admin/users/save}" th:object="${user}" method="post">
                            <input type="hidden" th:field="*{id}" />

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Nombre</label>
                                    <input type="text" class="form-control" th:field="*{firstName}" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Apellido</label>
                                    <input type="text" class="form-control" th:field="*{lastName}" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" th:field="*{email}" required>
                            </div>

                            <div class="mb-3" th:if="${user.id == null}">
                                <label class="form-label">Contraseña</label>
                                <input type="password" class="form-control" th:field="*{password}" required>
                            </div>

                            <div class="d-flex justify-content-end mt-4">
                                <a href="/admin/users" class="btn btn-secondary me-2">Cancelar</a>
                                <button type="submit" class="btn btn-primary px-4">Guardar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
