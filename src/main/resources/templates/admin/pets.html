<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head}"></head>

<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container-fluid">
        <div class="row">
            <!-- Reuse Sidebar -->
            <div class="col-md-3 col-lg-2 d-md-block bg-light sidebar collapse shadow-sm" style="min-height: 100vh;">
                <div class="position-sticky pt-3">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link text-dark" href="/admin/dashboard"><i
                                    class="bi bi-speedometer2 me-2"></i>Dashboard</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-dark" href="/admin/products"><i
                                    class="bi bi-cart me-2"></i>Productos</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active fw-bold text-primary" href="/admin/pets"><i
                                    class="bi bi-heart me-2"></i>Mascotas</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-dark" href="/admin/users"><i
                                    class="bi bi-people me-2"></i>Usuarios</a>
                        </li>
                    </ul>
                </div>
            </div>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <div class="d-flex justify-content-between align-items-center mb-3 border-bottom pb-2">
                    <h2>Gestión de Mascotas</h2>
                    <a href="/add-pet" class="btn btn-success"><i class="bi bi-plus-lg"></i> Nueva Mascota</a>
                </div>

                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th>ID</th>
                                        <th>Nombre</th>
                                        <th>Raza</th>
                                        <th>Edad</th>
                                        <th>Estado</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="pet : ${pets}">
                                        <td th:text="${pet.id}">#</td>
                                        <td>
                                            <div class="d-flex align-items-center">
                                                <img th:if="${pet.image != null}"
                                                    th:src="@{/uploads/pet/{filename}(filename=${pet.image})}"
                                                    style="width: 40px; height: 40px; object-fit: cover;"
                                                    class="rounded-circle me-2">
                                                <span th:text="${pet.namePet}" class="fw-bold">Nombre</span>
                                            </div>
                                        </td>
                                        <td th:text="${pet.breed}">Raza</td>
                                        <td th:text="${pet.age} + ' años'">Edad</td>
                                        <td>
                                            <span th:text="${pet.status}"
                                                th:class="${'badge ' + (pet.status == 'Adoptado' ? 'bg-success' : 'bg-warning text-dark')}">Estado</span>
                                        </td>
                                        <td>
                                            <a th:href="@{/admin/pets/delete/{id}(id=${pet.id})}"
                                                class="btn btn-sm btn-outline-danger"
                                                onclick="return confirm('¿Eliminar registro?')"><i
                                                    class="bi bi-trash"></i></a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
