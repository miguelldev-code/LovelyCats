<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head">
    <meta charset="utf-8">
    <title>Lovely Cats</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link th:href="@{/img/favicon.ico}" rel="icon">
    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins&family=Roboto:wght@700&display=swap" rel="stylesheet">
    <!-- Icon Font Stylesheet -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/lib/flaticon/font/flaticon.css}" rel="stylesheet">
    <link rel="shortcut icon" th:href="@{/img/logo.png}" />
    <!-- Libraries Stylesheet -->
    <link th:href="@{/lib/owlcarousel/assets/owl.carousel.min.css}" rel="stylesheet">
    <!-- Customize Bootstrap Stylesheet -->
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <!-- Template Stylesheet -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body>

    <nav th:fragment="navbar"
        class="navbar navbar-expand-lg bg-white navbar-light shadow-sm sticky-top py-3 py-lg-0 px-3 px-lg-0">
        <a th:href="@{/}" class="navbar-brand ms-lg-5">
            <h1 class="m-0 text-uppercase text-dark d-flex align-items-center">
                <i class="bi bi-heart-fill text-primary me-2"></i>Lovely Cats
            </h1>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarCollapse">
            <div class="navbar-nav ms-auto py-0">
                <a th:href="@{/}" class="nav-item nav-link active"><i class="bi bi-house-door me-1"></i> Inicio</a>
                <a th:href="@{/adopt}" class="nav-item nav-link"><i class="bi bi-emoji-smile me-1"></i> Adoptar</a>
                <a th:href="@{/service}" class="nav-item nav-link"><i class="bi bi-gear me-1"></i> Servicios</a>
                <a th:href="@{/products}" class="nav-item nav-link"><i class="bi bi-shop me-1"></i> Productos</a>

                <!-- Dropdown Idioma -->
                <div class="nav-item dropdown">
                    <a href="#" class="nav-link dropdown-toggle" data-bs-toggle="dropdown"><i
                            class="bi bi-globe me-1"></i> Idioma</a>
                    <div class="dropdown-menu m-0">
                        <a class="dropdown-item" href="?lang=es">Español</a>
                        <a class="dropdown-item" href="?lang=en">English</a>
                    </div>
                </div>
            </div>

            <!-- Acciones Derecha -->
            <div class="d-flex align-items-center ms-lg-5 me-lg-5">
                <a th:href="@{/cart}" class="btn btn-outline-primary rounded-circle me-3 position-relative"
                    style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;">
                    <i class="bi bi-cart-fill"></i>
                </a>

                <a sec:authorize="isAnonymous()" th:href="@{/login}"
                    class="btn btn-primary rounded-pill px-4">Ingresar</a>

                <div sec:authorize="isAuthenticated()" class="nav-item dropdown">
                    <a href="#" class="btn btn-outline-dark rounded-pill px-4 dropdown-toggle"
                        data-bs-toggle="dropdown">Mi Cuenta</a>
                    <div class="dropdown-menu m-0">
                        <a th:href="@{/admin}" class="dropdown-item" sec:authorize="hasRole('ADMIN')">Panel Admin</a>
                        <a th:href="@{/profile}" class="dropdown-item">Perfil</a>
                        <div class="dropdown-divider"></div>
                        <a th:href="@{/logout}" class="dropdown-item text-danger">Salir</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div th:fragment="footer" class="container-fluid bg-dark text-secondary mt-5 py-5 px-sm-3 px-md-5">
        <div class="row pt-5">
            <div class="col-lg-3 col-md-6 mb-5">
                <h4 class="text-uppercase text-light mb-4">Contacto</h4>
                <p class="mb-2"><i class="bi bi-geo-alt text-primary me-2"></i>Calle 1 #12 - 3</p>
                <p class="mb-2"><i class="bi bi-envelope-open text-primary me-2"></i>info@lovelycats.com</p>
                <p class="mb-0"><i class="bi bi-telephone text-primary me-2"></i>+1 234 567 890</p>
            </div>
            <!-- Enlaces rápidos simplificados -->
        </div>
    </div>

    <div th:fragment="scripts">
        <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
        <script th:src="@{/lib/easing/easing.min.js}"></script>
        <script th:src="@{/lib/waypoints/waypoints.min.js}"></script>
        <script th:src="@{/lib/owlcarousel/owl.carousel.min.js}"></script>
        <script th:src="@{/js/main.js}"></script>
    </div>

</body>

</html>
